[project]
name = "owelio-backend"
version = "0.1.0"
description = "Owelio expense-splitting API"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic[email]>=2.10.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0,<5",
    "sqlalchemy>=2.0.36",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
]
postgres = [
    "psycopg[binary]>=3.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["owelio"]
